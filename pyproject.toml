[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recommender-evaluation-lab"
version = "1.0.0"
description = "Offline recommender evaluation as the research object: sampled-metric bias, temporal leakage, and off-policy correction, measured against a fully observed ground truth."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Jesun Ahmad Ushno" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
